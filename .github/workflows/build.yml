name: Build ActionGesture Deb

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Setup iOS SDK & RootHide Header
        run: |
          rm -rf ~/theos/sdks
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git ~/theos/sdks
          cd ~/theos/sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          rm -rf .git
          
          # 下载缺失的 roothide.h 头文件
          curl -sLo ~/theos/include/roothide.h https://raw.githubusercontent.com/RootHide/roothide-theos/master/include/roothide.h

      - name: Compile Rootless Package
        run: |
          make package SCHEME=rootless FINALPACKAGE=1

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ActionGesture-Rootless-deb
          path: packages/*.deb
