name: Build ActionGesture Deb

on:
  workflow_dispatch:

jobs:
  build:
    name: Build on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Setup iOS SDK & Mock RootHide Header
        run: |
          rm -rf ~/theos/sdks
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git ~/theos/sdks
          cd ~/theos/sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          rm -rf .git
          
          # 创建纯宏定义的 roothide.h，不引入任何冲突的方法签名
          cat << 'EOF' > ~/theos/include/roothide.h
          #pragma once
          #define jbroot(path) path
          #define rootfs(path) path
          EOF

      - name: Compile Rootless Package
        run: |
          make clean
          make package SCHEME=rootless FINALPACKAGE=1

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ActionGesture-Rootless-deb
          path: packages/*.deb
