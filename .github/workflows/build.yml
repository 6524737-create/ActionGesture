name: Build ActionGesture Deb

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ldid
        run: |
          brew install ldid

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Setup iOS SDK & Mock RootHide
        run: |
          rm -rf ~/theos/sdks
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git ~/theos/sdks
          cd ~/theos/sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          rm -rf .git
          
          # 注入类型安全、同时兼容 ObjC 与 C 字符串的 roothide.h
          cat << 'EOF' > ~/theos/include/roothide.h
          #pragma once
          #include <stdlib.h>
          #include <string.h>

          #ifdef __OBJC__
          #import <Foundation/Foundation.h>

          static inline __attribute__((overloadable)) NSString *jbroot(NSString *path) {
              if (!path) return nil;
              if ([path hasPrefix:@"/var/jb"]) return path;
              if ([path hasPrefix:@"/"]) return [@"/var/jb" stringByAppendingString:path];
              return [NSString stringWithFormat:@"/var/jb/%@", path];
          }

          static inline __attribute__((overloadable)) NSString *rootfs(NSString *path) {
              return path;
          }
          #endif

          static inline __attribute__((overloadable)) const char *jbroot(const char *path) {
              if (!path) return NULL;
              if (strncmp(path, "/var/jb", 7) == 0) return path;
              __thread static char buf[1024];
              snprintf(buf, sizeof(buf), "/var/jb%s%s", (path[0] == '/' ? "" : "/"), path);
              return buf;
          }

          static inline __attribute__((overloadable)) const char *rootfs(const char *path) {
              return path;
          }

          #define jbroot jbroot
          #define rootfs rootfs
          EOF

      - name: Compile Rootless Package
        run: |
          make clean
          make package SCHEME=rootless FINALPACKAGE=1

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ActionGesture-Rootless-deb-${{ matrix.os }}
          path: packages/*.deb
